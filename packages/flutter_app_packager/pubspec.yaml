name: flutter_app_packager
description: Package your Flutter app into OS-specific bundles (.dmg, .exe, etc.) via Dart or the command line.
version: 0.6.11
homepage: https://fastforge.dev
repository: https://github.com/fastforgedev/fastforge/tree/main/packages/flutter_app_packager

environment:
  sdk: ">=2.16.0 <4.0.0"

dependencies:
  archive: ^3.6.1
  io: ^1.0.4
  liquid_engine: ^0.2.2
  msix: ^3.16.6
  mustache_template: ^2.0.0
  path: ^1.8.3
  pub_semver: ^2.1.0
  pubspec_parse: ^1.1.0
  shell_executor:
    git:
      url: https://github.com/dsc7219356/flutter_distributor.git
      path: packages/shell_executor
  yaml: ^3.1.0

dev_dependencies:
  dependency_validator: ^3.0.0
  test: ^1.23.1
